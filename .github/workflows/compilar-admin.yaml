
name: Compilar DCO Admin (Privado)

# Ejecutar únicamente de forma manual
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================
  # COMPILACIÓN PARA WINDOWS
  # ============================================

  admin-windows:
    name: DCO Admin - Windows
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests pyinstaller

      - name: Verificar archivos Python
        shell: pwsh
        run: |
          python -m py_compile admin/DCO_Admin.py feedback_api.py feedback_config.py

      - name: Compilar DCO Admin EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name DCO_Admin `
            --paths . `
            --hidden-import feedback_api `
            --hidden-import feedback_config `
            admin/DCO_Admin.py

      - name: Verificar ejecutable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DCO_Admin.exe")) {
            throw "No se genero DCO_Admin.exe"
          }

      - name: Crear ZIP Windows
        shell: pwsh
        run: |
          Compress-Archive `
            -LiteralPath "dist/DCO_Admin.exe" `
            -DestinationPath "DCO_Admin_Windows.zip" `
            -Force

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: DCO_Admin_Windows
          path: DCO_Admin_Windows.zip
          if-no-files-found: error
          retention-days: 14

  # ============================================
  # COMPILACIÓN PARA MAC APPLE SILICON
  # ============================================

  admin-mac:
    name: DCO Admin - Mac Apple Silicon
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 requests pyinstaller

      - name: Verificar archivos Python
        run: |
          python -m py_compile admin/DCO_Admin.py feedback_api.py feedback_config.py

      - name: Compilar DCO Admin APP
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name DCO_Admin \
            --paths . \
            --hidden-import feedback_api \
            --hidden-import feedback_config \
            admin/DCO_Admin.py

      - name: Verificar aplicacion Mac
        run: |
          test -d "dist/DCO_Admin.app"

      - name: Crear ZIP Mac
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "dist/DCO_Admin.app" \
            "DCO_Admin_Mac.zip"

      - name: Verificar ZIP Mac
        run: |
          unzip -Z -1 DCO_Admin_Mac.zip | grep '^DCO_Admin.app/Contents/' > /dev/null

      - name: Subir artefacto Mac
        uses: actions/upload-artifact@v4
        with:
          name: DCO_Admin_Mac
          path: DCO_Admin_Mac.zip
          if-no-files-found: error
          retention-days: 14
